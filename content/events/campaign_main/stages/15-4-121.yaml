programs:
- activation_modes:
  - normal
  battle: 0
  statements:
  - condition:
      conditions:
      - condition:
          flag: clear_mode
          tag: flag
          value: true
        tag: not
      - flag: map_has_mob_move
        tag: flag
        value: true
      tag: all
    tag: branch
    when_false: []
    when_true:
    - action:
        category: enemy_movement
        index: 0
      expected_target: null
      tag: perform_mechanic
    - condition:
        cell: K9
        operator: equal
        property: accessible
        tag: cell_property
        value: true
      tag: branch
      when_false: []
      when_true:
      - action:
          expected: enemy
          tag: clear_chosen_enemy
          target: K9
        tag: return_battle
