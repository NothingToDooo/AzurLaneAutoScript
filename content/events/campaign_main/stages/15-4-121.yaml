        conditions:
        - condition:
            flag: clear_mode
            tag: flag
            value: true
          tag: not
        - cell: A1
          tag: cell_accessible
        tag: all
      step:
        expected: enemy
        tag: clear_chosen_enemy
        target: A1
      tag: guarded
    - preserve: 0
      tag: clear_filtered_enemy
    - tag: default_battle
  2:
    steps:
    - preserve: 0
      tag: clear_filtered_enemy
    - tag: default_battle
  3:
    steps:
    - tag: default_battle
  4:
    steps:
    - preserve: 0
      tag: clear_filtered_enemy
    - tag: default_battle
  6:
    steps:
