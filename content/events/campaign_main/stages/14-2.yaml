schema_version: 5
map:
  name: 14-2
  shape: I8
  camera_data:
  - D2
  - D6
  - F2
  - F6
  camera_data_spawn_point:
  - F2
  map_data: 'MB MB ++ -- ME -- ME ++ ++

    -- ME ++ ME -- Me -- SP SP

    -- -- Me Me Me -- -- ME ME

    ME __ -- Me -- ME -- -- ME

    MM ME -- -- Me -- -- ME ++

    ++ ++ ++ -- ++ -- ME ME ME

    Me MB ME __ -- -- Me MM ME

    ME -- -- -- ME ME ++ ++ ME'
  weight_data: '50 50 50 60 60 60 50 50 50

    50 50 50 60 60 50 50 50 50

    50 50 50 60 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 60 70

    50 50 50 50 50 50 50 60 80

    50 50 50 50 50 50 50 50 90'
  spawn_data:
  - battle: 0
    enemy: 3
  - battle: 1
    enemy: 2
  - battle: 2
    enemy: 2
  - battle: 3
    enemy: 1
  - battle: 4
    enemy: 1
  - battle: 5
  - battle: 6
    boss: 1
config:
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: false
  MAP_HAS_AMBUSH: true
  MAP_HAS_MYSTERY: true
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  MAP_SWIPE_MULTIPLY:
  - 1.006
  - 1.025
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 0.973
  - 0.991
enemy_filter: 1T > 1L > 1E > 1M > 2T > 2L > 2E > 2M > 3T > 3L > 3E > 3M
battles:
  0:
    steps:
    - tag: clear_filtered_enemy
      preserve: 0
    - tag: default_battle
  5:
    steps:
    - preserve: 0
      tag: clear_filtered_enemy
    - tag: default_battle
  6:
    steps:
    - strategy: fleet_boss
      tag: clear_boss
mechanics:
  roadblocks:
  - battle: 0
    roads:
    - paths:
      - - A4
        - B5
    - paths:
      - - G6
        - G7
        - H6
      - - G6
        - G7
        - H7
    selection: weakest
    tag: clear
  fleet_coordination:
  - battle: 0
    destination: D6
    expected: any
    fleet: fleet_boss
    tag: move
  - battle: 0
    fleet: fleet_1
    tag: ensure
  pickups:
  - battle: 0
    cell: H7
    fleet: fleet_boss
    kind: flare
    tag: map_item
  - battle: 0
    cell: A5
    fleet: fleet_boss
    kind: flare
    tag: map_item
  map_interactions: []
  map_mutations: []
  moving_enemies:
    turns: []
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs:
- activation_modes:
  - normal
  battle: 0
  statements:
  - condition:
      conditions:
      - condition:
          marker: picked_map_item:flare:7:6
          tag: marker
          value: true
        tag: not
      - cell: H7
        operator: equal
        property: accessible
        tag: cell_property
        value: true
      - cell: A5
        operator: equal
        property: accessible
        tag: cell_property
        value: true
      tag: all
    tag: branch
    when_false: []
    when_true:
    - action:
        category: pickups
        index: 0
      expected_target: any
      tag: perform_mechanic
    - action:
        category: pickups
        index: 1
      expected_target: any
      tag: perform_mechanic
    - action:
        category: fleet_coordination
        index: 0
      expected_target: any
      tag: perform_mechanic
    - action:
        category: fleet_coordination
        index: 1
      expected_target: any
      tag: perform_mechanic
  - action:
      category: roadblocks
      index: 0
    expected_target: enemy
    tag: attempt_mechanic
  - action:
      preserve: 1
      tag: clear_filtered_enemy
    tag: attempt_battle
  - action:
      tag: default_battle
    tag: return_battle
boss_approaches: []
hard_mode: null
