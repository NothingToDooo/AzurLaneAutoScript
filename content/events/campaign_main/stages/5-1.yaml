schema_version: 5
map:
  name: 5-1
  shape: H6
  camera_data:
  - D2
  - D4
  camera_data_spawn_point:
  - D2
  - D4
  map_data: 'MB MM ME ++ ++ ++ ++ ++

    SP -- -- -- ME -- -- MB

    -- -- ME ME -- -- SP ME

    -- ME -- ME -- ME ME MB

    SP -- ME -- -- -- ++ ++

    MB ME -- ME -- MA ++ ++'
  weight_data: '10 10 50 50 50 50 50 50

    10 10 10 10 10 10 10 10

    10 20 20 20 10 10 10 10

    10 20 20 20 10 50 10 10

    10 10 10 10 10 50 50 50

    10 20 20 20 20 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 3
    mystery: 1
  - battle: 1
    enemy: 1
  - battle: 2
    enemy: 1
  - battle: 3
    enemy: 1
  - battle: 4
    enemy: 1
    boss: 1
config:
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: false
  MAP_HAS_AMBUSH: true
  MAP_HAS_MYSTERY: true
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  MAP_SWIPE_MULTIPLY:
  - 1.064
  - 1.084
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.029
  - 1.048
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: default_battle
  4:
    steps:
    - tag: clear_boss
      strategy: fleet_boss
mechanics:
  roadblocks: []
  fleet_coordination: []
  pickups: []
  map_interactions:
  - battle: 0
    ignored: []
    nearby: true
    tag: clear_all_mystery
  - battle: 4
    ignored: []
    nearby: true
    tag: clear_all_mystery
  map_mutations: []
  moving_enemies:
    turns: []
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures:
  - battle: 4
    operations:
    - check_accessibility
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs:
- activation_modes:
  - normal
  battle: 0
  statements:
  - action:
      category: map_interactions
      index: 0
    expected_target: null
    tag: perform_mechanic
  - action:
      tag: default_battle
    tag: return_battle
- activation_modes:
  - normal
  battle: 4
  statements:
  - action:
      category: map_interactions
      index: 1
    expected_target: null
    tag: perform_mechanic
  - condition:
      conditions:
      - presence: boss
        tag: map_presence
      - condition:
          fleet: fleet_boss
          tag: boss_accessible
        tag: not
      tag: all
    tag: branch
    when_false: []
    when_true:
    - action:
        tag: default_battle
      tag: return_battle
  - action:
      strategy: fleet_boss
      tag: clear_boss
    tag: return_battle
boss_approaches: []
hard_mode: null
