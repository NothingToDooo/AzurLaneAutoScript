schema_version: 4
map:
  name: 15-2
  shape: I8
  camera_data:
  - C2
  - C6
  - F2
  - F6
  camera_data_spawn_point:
  - F2
  map_data: 'ME -- ME ME Me -- ++ ++ ++

    ME -- -- ++ ME ME ME SP SP

    -- ME ME Me -- -- -- -- --

    -- -- -- -- -- ME ME Me --

    ME -- ++ ME Me -- ME ME --

    Me -- ME __ ME ++ ++ ++ Me

    ++ MB -- ME ME ++ Me MB --

    ++ MB ME -- ME Me -- -- ME'
  weight_data: '50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 6
  - battle: 1
    enemy: 2
  - battle: 2
    enemy: 1
  - battle: 3
  - battle: 4
  - battle: 5
  - battle: 6
    boss: 1
config:
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: false
  MAP_HAS_AMBUSH: true
  MAP_HAS_MYSTERY: false
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  MAP_SWIPE_MULTIPLY:
  - 0.993
  - 1.011
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 0.96
  - 0.978
enemy_filter: 1L > 1M > 1E > 2L > 3L > 2M > 2E > 1C > 2C > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: clear_filtered_enemy
      preserve: 0
    - tag: default_battle
  1:
    steps:
    - preserve: 1
      tag: clear_filtered_enemy
    - tag: default_battle
  5:
    steps:
    - preserve: 0
      tag: clear_filtered_enemy
    - tag: default_battle
  6:
    steps:
    - strategy: fleet_boss
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination:
  - battle: 0
    expected: enemy
    fleet: active
    tag: clear_target
    target: G7
  pickups: []
  map_interactions: []
  map_mutations: []
  moving_enemies:
    turns: []
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement:
  - battle: 0
    source: I6
    target: I7
  - battle: 0
    source: I7
    target: I8
  procedures: []
  preset_routes: []
  fixed_target_sequences: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs:
- activation_modes:
  - normal
  - clear_all
  battle: 0
  statements:
  - condition:
      conditions:
      - flag: clear_all
        tag: flag
        value: true
      - flag: clear_mode
        tag: flag
        value: true
      tag: all
    tag: branch
    when_false:
    - condition:
        conditions:
        - condition:
            flag: clear_mode
            tag: flag
            value: true
          tag: not
        - flag: map_has_mob_move
          tag: flag
          value: true
        tag: all
      tag: branch
      when_false: []
      when_true:
      - action:
          category: enemy_movement
          index: 0
        expected_target: null
        tag: perform_mechanic
      - action:
          category: enemy_movement
          index: 1
        expected_target: null
        tag: perform_mechanic
      - condition:
          cell: G7
          operator: equal
          property: accessible
          tag: cell_property
          value: true
        tag: branch
        when_false: []
        when_true:
        - action:
            expected: enemy
            tag: clear_chosen_enemy
            target: G7
          tag: return_battle
    - action:
        preserve: 1
        tag: clear_filtered_enemy
      tag: attempt_battle
    - action:
        tag: default_battle
      tag: return_battle
    when_true:
    - tag: delegate
      target: default_mode
boss_approaches: []
hard_mode: null
