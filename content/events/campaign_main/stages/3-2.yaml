schema_version: 4
map:
  name: 3-2
  shape: H4
  camera_data:
  - E2
  camera_data_spawn_point:
  - D1
  - D2
  map_data: 'SP -- -- ME -- ME ME MB

    ++ ++ ME -- ME ++ ++ ++

    -- ++ -- ME -- MA ++ ++

    SP ME -- -- ME MM -- ++'
  weight_data: '50 50 50 30 30 20 10 09

    50 50 40 40 30 20 10 10

    50 50 50 40 40 50 20 20

    50 50 50 50 35 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 2
    mystery: 1
  - battle: 1
    enemy: 1
  - battle: 2
    enemy: 1
  - battle: 3
    enemy: 2
    boss: 1
config:
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: false
  MAP_HAS_AMBUSH: true
  MAP_HAS_MYSTERY: true
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  MAP_SWIPE_MULTIPLY:
  - 1.064
  - 1.084
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.029
  - 1.048
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: default_battle
  3:
    steps:
    - tag: clear_boss
      strategy: fleet_boss
mechanics:
  roadblocks: []
  fleet_coordination:
  - battle: 0
    fleet: fleet_2
    tag: push_forward
  - battle: 0
    fleet: fleet_2
    tag: rescue
    target: H1
  pickups: []
  map_interactions:
  - battle: 0
    ignored: []
    nearby: true
    tag: clear_all_mystery
  - battle: 3
    ignored: []
    nearby: true
    tag: clear_all_mystery
  map_mutations: []
  moving_enemies:
    turns: []
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures:
  - battle: 3
    operations:
    - check_accessibility
  preset_routes: []
  fixed_target_sequences: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs:
- activation_modes:
  - normal
  battle: 0
  statements:
  - action:
      category: fleet_coordination
      index: 0
    expected_target: any
    tag: perform_mechanic
  - action:
      category: fleet_coordination
      index: 1
    expected_target: any
    tag: attempt_mechanic
  - action:
      category: map_interactions
      index: 0
    expected_target: null
    tag: perform_mechanic
  - action:
      tag: default_battle
    tag: return_battle
- activation_modes:
  - normal
  battle: 3
  statements:
  - action:
      category: map_interactions
      index: 1
    expected_target: null
    tag: perform_mechanic
  - condition:
      condition:
        cell: H1
        fleet: fleet_boss
        tag: cell_accessible_for_fleet
      tag: not
    tag: branch
    when_false: []
    when_true:
    - action:
        tag: default_battle
      tag: return_battle
  - action:
      strategy: fleet_boss
      tag: clear_boss
    tag: return_battle
boss_approaches: []
hard_mode: null
