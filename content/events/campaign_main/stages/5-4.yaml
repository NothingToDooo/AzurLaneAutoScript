  pickups: []
  map_interactions: []
  map_mutations: []
  moving_enemies:
    turns: []
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures:
  - battle: 4
    operations:
    - check_accessibility
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs:
- activation_modes:
  - normal
  battle: 0
  statements:
  - action:
      category: roadblocks
      index: 0
    expected_target: enemy
    tag: attempt_mechanic
  - action:
      category: roadblocks
      index: 1
    expected_target: enemy
    tag: attempt_mechanic
  - action:
      tag: default_battle
    tag: return_battle
- activation_modes:
  - normal
  battle: 4
  statements:
  - condition:
      conditions:
      - presence: boss
        tag: map_presence
      - condition:
          fleet: fleet_boss
          tag: boss_accessible
        tag: not
      tag: all
    tag: branch
    when_false: []
    when_true:
    - action:
        category: roadblocks
        index: 2
      expected_target: enemy
      tag: attempt_mechanic
    - action:
        category: roadblocks
        index: 3
      expected_target: enemy
      tag: attempt_mechanic
  - action:
      strategy: fleet_boss
      tag: clear_boss
    tag: return_battle
boss_approaches: []
hard_mode: null
