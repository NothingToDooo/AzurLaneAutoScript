schema_version: 5
map:
  name: 5-4
  shape: H5
  camera_data:
  - D3
  - E3
  camera_data_spawn_point:
  - D2
  - E3
  map_data: '++ ++ ++ SP MB ME -- MB

    SP -- ME -- ME -- ME SP

    -- -- -- ++ ++ ME __ ME

    ME MB ME MA ++ -- ME --

    ++ ++ ME -- MB ME -- MB'
  weight_data: '50 50 50 50 10 20 30 30

    50 50 10 10 10 10 30 30

    50 50 10 10 10 10 30 25

    50 10 10 10 10 10 30 30

    50 50 50 10 10 10 30 30'
  spawn_data:
  - battle: 0
    enemy: 3
  - battle: 1
    enemy: 2
  - battle: 2
    enemy: 1
  - battle: 3
    enemy: 2
  - battle: 4
    enemy: 1
    boss: 1
config:
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: false
  MAP_HAS_AMBUSH: true
  MAP_HAS_MYSTERY: true
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  MAP_SWIPE_MULTIPLY:
  - 1.064
  - 1.084
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.029
  - 1.048
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: default_battle
  4:
    steps:
    - tag: clear_boss
      strategy: fleet_boss
mechanics:
  roadblocks:
  - battle: 0
    roads:
    - paths:
      - - C2
      - - E2
        - F1
      - - C4
      - - F5
      - - F3
        - G2
        - H3
      - - F3
        - G4
        - H3
    selection: default
    tag: clear
  - battle: 0
    roads:
    - paths:
      - - E2
        - F1
      - - F1
        - G2
        - H3
      - - F5
        - G4
        - H3
      - - F3
        - G2
        - H3
      - - F3
        - G4
        - H3
    selection: default
    tag: clear_potential
  - battle: 4
    roads:
    - paths:
      - - C2
      - - E2
        - F1
      - - C4
      - - F5
      - - F3
        - G2
        - H3
      - - F3
        - G4
        - H3
    selection: default
    tag: clear
  - battle: 4
    roads:
    - paths:
      - - E2
        - F1
      - - F1
        - G2
        - H3
      - - F5
        - G4
        - H3
      - - F3
        - G2
        - H3
      - - F3
        - G4
        - H3
    selection: default
    tag: clear_potential
