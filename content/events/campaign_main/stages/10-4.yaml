  map_data: 'MB ME ME -- ++ MB -- ++ ++

    ME ME ++ ME ++ -- Me -- ++

    -- __ ME Me ME ++ ME ME --

    ++ ++ ++ -- ME -- Me ++ ME

    SP -- -- Me -- ++ __ ME --

    SP -- -- -- Me ++ ME -- MB'
