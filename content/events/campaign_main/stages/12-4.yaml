schema_version: 4
map:
  name: 12-4
  shape: K8
  camera_data:
  - D2
  - D6
  - H2
  - H6
  camera_data_spawn_point:
  - D6
  map_data: 'MB MB ME -- ME ++ ++ ++ MB MB ++

    ME ++ -- ME -- MA ++ ++ ME Me ++

    -- ME __ Me Me -- Me Me -- Me --

    ++ -- ME ++ ++ Me ME __ ++ ++ ME

    ++ ME ME -- ME ME -- ME -- ++ --

    ++ __ Me Me -- Me ME ++ __ -- ME

    ME -- Me -- Me -- Me -- -- ME --

    -- -- -- ME SP SP ++ ++ ++ ME --'
  weight_data: '50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 2
  - battle: 1
    enemy: 2
  - battle: 2
    enemy: 2
  - battle: 3
    enemy: 1
  - battle: 4
    enemy: 1
  - battle: 5
  - battle: 6
    boss: 1
config:
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: false
  MAP_HAS_AMBUSH: true
  MAP_HAS_MYSTERY: true
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  MAP_SWIPE_MULTIPLY:
  - 0.977
  - 0.995
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 0.945
  - 0.962
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: default_battle
  6:
    steps:
    - tag: clear_boss
      strategy: fleet_boss
mechanics:
  roadblocks:
  - battle: 0
    roads:
    - paths:
      - - H3
        - B6
        - C5
    selection: default
    tag: clear
  - battle: 0
    roads:
    - paths:
      - - H3
        - B6
        - C5
    selection: default
    tag: clear_potential
  - battle: 6
    roads:
    - paths:
      - - H3
        - B6
        - C5
    selection: default
    tag: clear
  fleet_coordination: []
  pickups:
  - battle: 0
    fleet: active
    tag: ammo
  - battle: 6
    fleet: active
    tag: ammo
  map_interactions: []
  map_mutations: []
  moving_enemies:
    turns: []
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures:
  - battle: 6
    operations:
    - check_accessibility
  preset_routes: []
  fixed_target_sequences: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs:
- activation_modes:
  - normal
  battle: 0
  statements:
  - condition:
      metric: battle_count
      operator: greater_than_or_equal
      tag: metric
      value: 3
    tag: branch
    when_false: []
    when_true:
    - action:
        category: pickups
        index: 0
      expected_target: any
      tag: perform_mechanic
  - action:
      category: roadblocks
      index: 0
    expected_target: enemy
    tag: attempt_mechanic
  - action:
      category: roadblocks
      index: 1
    expected_target: enemy
    tag: attempt_mechanic
  - action:
      tag: default_battle
    tag: return_battle
- activation_modes:
  - normal
  battle: 6
  statements:
  - action:
      category: pickups
      index: 1
    expected_target: any
    tag: perform_mechanic
  - condition:
      conditions:
      - presence: boss
        tag: map_presence
      - condition:
          fleet: fleet_boss
          tag: boss_accessible
        tag: not
      tag: all
    tag: branch
    when_false: []
    when_true:
    - action:
        category: roadblocks
        index: 2
      expected_target: enemy
      tag: attempt_mechanic
  - action:
      strategy: fleet_boss
      tag: clear_boss
    tag: return_battle
boss_approaches: []
hard_mode: null
