schema_version: 5
map:
  name: 2-4
  shape: G4
  camera_data:
  - D2
  camera_data_spawn_point:
  - D2
  map_data: '-- ++ ++ ++ ME ME MB

    SP -- ME -- -- ME --

    -- -- ME -- ME ++ ++

    -- ME -- SP -- MA ++'
  weight_data: '20 20 20 20 12 11 10

    20 20 20 20 10 10 10

    20 20 20 20 30 20 20

    20 20 20 20 20 20 20'
  spawn_data:
  - battle: 0
    enemy: 2
  - battle: 1
    enemy: 2
  - battle: 2
    enemy: 1
  - battle: 3
    enemy: 2
    boss: 1
config:
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: false
  MAP_HAS_AMBUSH: true
  MAP_HAS_MYSTERY: true
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  MAP_SWIPE_MULTIPLY:
  - 1.064
  - 1.084
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.029
  - 1.048
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: default_battle
  3:
    steps:
    - tag: clear_boss
      strategy: fleet_boss
mechanics:
  roadblocks:
  - battle: 0
    roads:
    - paths:
      - - F2
        - F1
      - - F2
        - E1
    selection: default
    tag: clear
  - battle: 0
    roads:
    - paths:
      - - F2
        - F1
      - - F2
        - E1
    selection: default
    tag: clear_potential
  - battle: 3
    roads:
    - paths:
      - - F2
        - F1
      - - F2
        - E1
    selection: default
    tag: clear
  fleet_coordination: []
  pickups: []
  map_interactions: []
  map_mutations: []
  moving_enemies:
    turns: []
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures:
  - battle: 3
    operations:
    - check_accessibility
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs:
- activation_modes:
  - normal
  battle: 0
  statements:
  - action:
      category: roadblocks
      index: 0
    expected_target: enemy
    tag: attempt_mechanic
  - action:
      category: roadblocks
      index: 1
    expected_target: enemy
    tag: attempt_mechanic
  - action:
      tag: default_battle
    tag: return_battle
- activation_modes:
  - normal
  battle: 3
  statements:
  - condition:
      condition:
        cell: G1
        fleet: fleet_boss
        tag: cell_accessible_for_fleet
      tag: not
    tag: branch
    when_false: []
    when_true:
    - action:
        category: roadblocks
        index: 2
      expected_target: enemy
      tag: attempt_mechanic
    - action:
        tag: default_battle
      tag: return_battle
  - action:
      strategy: fleet_boss
      tag: clear_boss
    tag: return_battle
boss_approaches: []
hard_mode: null
