schema_version: 6
map:
  name: D2
  shape: I7
  camera_data:
  - D2
  - D5
  - F2
  - F5
  camera_data_spawn_point:
  - F2
  map_data: 'ME -- ME -- ME ++ -- SP SP

    ME -- ME -- -- ++ ME -- --

    ++ ME -- Me -- ++ Me -- ME

    ++ ++ ++ MS -- MS -- -- --

    -- -- __ -- -- -- -- ME --

    -- Me -- MS ME MS Me ++ ++

    MB -- -- ++ ME -- -- ++ ++'
  weight_data: '50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 2
    siren: 2
  - battle: 1
    enemy: 1
  - battle: 2
    enemy: 2
    siren: 1
  - battle: 3
    enemy: 1
  - battle: 4
    enemy: 2
  - battle: 5
    enemy: 1
  - battle: 6
    boss: 1
  map_data_loop: 'ME -- ME -- ME ++ -- SP SP

    ME -- ME -- -- ++ ME -- --

    ++ ME -- Me -- ++ Me -- ME

    ++ ++ ++ MS -- MS -- -- --

    -- -- __ -- -- -- -- ME --

    MB Me -- MS ME MS Me ++ ++

    MB MB -- ++ ME -- -- ++ ++'
config:
  MAP_HAS_MAP_STORY: true
  MAP_HAS_FLEET_STEP: true
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: false
  MAP_SIREN_TEMPLATE:
  - SS
  - CAlightning
  - BBlightning
  MAP_HAS_SIREN: true
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  MAP_SWIPE_MULTIPLY:
  - 1.115
  - 1.136
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.078
  - 1.098
  MAP_ENSURE_EDGE_INSIGHT_CORNER: bottom-right
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: clear_siren
    - preserve: 0
      tag: clear_filtered_enemy
    - tag: default_battle
  5:
    steps:
    - tag: clear_siren
    - preserve: 0
      tag: clear_filtered_enemy
    - tag: default_battle
  6:
    steps:
    - strategy: fleet_boss
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination: []
  pickups: []
  map_interactions: []
  moving_enemies:
    turns:
    - 2
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs: []
boss_approaches: []
hard_mode: null
