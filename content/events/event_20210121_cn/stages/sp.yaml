schema_version: 5
map:
  name: SP
  shape: I7
  camera_data:
  - D2
  - D5
  - F2
  - F5
  camera_data_spawn_point:
  - D2
  - D5
  map_data: '-- MS ++ -- MS ME -- -- --

    -- -- Me -- -- ++ ME -- --

    SP -- -- -- Me -- -- ++ ++

    -- -- Me -- __ ME -- MB --

    SP -- -- MS -- ME -- ++ ++

    -- Me ++ ++ ++ Me ME ++ ++

    -- -- Me -- ME -- -- ME --'
  weight_data: '50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 20 50 50 50 50

    50 50 50 50 50 20 10 50 50

    50 50 50 50 50 20 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 2
    siren: 2
  - battle: 1
    enemy: 1
  - battle: 2
    enemy: 2
    siren: 1
  - battle: 3
    enemy: 1
  - battle: 4
    enemy: 2
  - battle: 5
    enemy: 1
  - battle: 6
  - battle: 7
    boss: 1
config:
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: true
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: true
  MAP_SIREN_TEMPLATE:
  - Carabiniere
  - Trento
  - Littorio
  MAP_HAS_SIREN: true
  STAR_REQUIRE_1: 0
  STAR_REQUIRE_2: 0
  STAR_REQUIRE_3: 0
  MAP_SWIPE_MULTIPLY:
  - 1.064
  - 1.084
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.029
  - 1.048
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: clear_siren
    - tag: default_battle
  7:
    steps:
    - strategy: fleet_boss
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination:
  - battle: 0
    fleet: fleet_2
    tag: protect
  - battle: 0
    fleet: fleet_2
    tag: push_forward
  pickups: []
  map_interactions: []
  map_mutations: []
  moving_enemies:
    turns:
    - 2
    - 3
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures:
  - battle: 0
    operations:
    - check_accessibility
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs:
- activation_modes:
  - normal
  battle: 0
  statements:
  - condition:
      presence: siren
      tag: map_presence
    tag: branch
    when_false:
    - action:
        category: fleet_coordination
        index: 1
      expected_target: any
      tag: perform_mechanic
    when_true:
    - action:
        category: fleet_coordination
        index: 0
      expected_target: any
      tag: attempt_mechanic
  - action:
      genres: []
      tag: clear_siren
    tag: attempt_battle
  - action:
      tag: default_battle
    tag: return_battle
boss_approaches: []
hard_mode: null
