schema_version: 4
map:
  name: SP
  shape: I7
  camera_data:
  - D2
  - D5
  - F2
  - F5
  camera_data_spawn_point:
  - D2
  map_data: '-- MS ++ SP -- SP -- -- ME

    -- -- Me -- -- -- ME -- --

    ++ ++ -- MS Me -- ++ ++ --

    ++ ++ Me -- __ -- ME ++ MS

    -- -- ME -- -- ME -- ME --

    -- Me -- ++ -- ++ ME -- --

    -- -- Me ++ MB ++ -- ME --'
  weight_data: '50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 2
    siren: 2
  - battle: 1
    enemy: 1
  - battle: 2
    enemy: 2
    siren: 1
  - battle: 3
    enemy: 1
  - battle: 4
    enemy: 2
  - battle: 5
    enemy: 1
  - battle: 6
  - battle: 7
    boss: 1
config:
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: true
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: false
  MAP_SIREN_TEMPLATE:
  - CL
  - CA
  - BB
  - CV
  MAP_HAS_SIREN: true
  STAR_REQUIRE_1: 0
  STAR_REQUIRE_2: 0
  STAR_REQUIRE_3: 0
  MAP_SWIPE_MULTIPLY:
  - 1.175
  - 1.197
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.137
  - 1.158
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: clear_siren
    - tag: clear_filtered_enemy
      preserve: 0
    - tag: default_battle
  5:
    steps:
    - tag: clear_siren
    - preserve: 0
      tag: clear_filtered_enemy
    - tag: default_battle
  7:
    steps:
    - strategy: fleet_boss
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination:
  - battle: 0
    fleet: fleet_2
    tag: protect
  pickups: []
  map_interactions: []
  map_mutations: []
  moving_enemies:
    turns:
    - 3
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures: []
  preset_routes: []
  fixed_target_sequences: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs:
- activation_modes:
  - normal
  battle: 0
  statements:
  - action:
      category: fleet_coordination
      index: 0
    expected_target: any
    tag: attempt_mechanic
  - action:
      genres: []
      tag: clear_siren
    tag: attempt_battle
  - action:
      preserve: 2
      tag: clear_filtered_enemy
    tag: attempt_battle
  - action:
      tag: default_battle
    tag: return_battle
boss_approaches: []
hard_mode: null
