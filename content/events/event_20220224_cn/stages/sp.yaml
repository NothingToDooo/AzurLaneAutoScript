schema_version: 6
map:
  name: SP
  shape: J9
  camera_data:
  - D2
  - D6
  - G2
  - G6
  camera_data_spawn_point:
  - G6
  map_data: '-- -- ME -- -- -- -- ME -- --

    -- ME -- -- ++ -- ME -- -- --

    -- __ -- ME ++ MS ++ ++ ++ ++

    -- ME -- -- -- -- MB -- ++ --

    ME -- MS -- -- -- -- SP -- Me

    -- Me -- -- -- -- SP -- -- Me

    ++ ++ -- -- ++ MS ++ ++ ++ --

    -- ++ -- ME ++ -- Me -- ME --

    -- -- -- -- -- -- -- -- -- --'
  weight_data: '50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 1
    siren: 2
  - battle: 1
    enemy: 1
  - battle: 2
    enemy: 2
    siren: 1
  - battle: 3
    enemy: 1
  - battle: 4
    enemy: 2
  - battle: 5
    enemy: 1
  - battle: 6
  - battle: 7
    boss: 1
  map_data_loop: '-- -- ME -- -- -- -- ME -- --

    -- ME -- -- ++ -- ME -- -- --

    -- __ -- ME ++ MS ++ ++ ++ ++

    -- ME -- -- -- -- MB -- ++ --

    ME -- MS ME -- -- -- SP -- Me

    -- Me -- -- -- -- SP -- -- Me

    ++ ++ -- -- ++ MS ++ ++ ++ --

    -- ++ -- ME ++ -- Me -- ME --

    -- -- -- -- -- -- -- -- -- --'
  spawn_data_loop:
  - battle: 0
    enemy: 2
    siren: 2
  - battle: 1
    enemy: 1
  - battle: 2
    enemy: 2
    siren: 1
  - battle: 3
    enemy: 1
  - battle: 4
    enemy: 2
  - battle: 5
    enemy: 1
  - battle: 6
  - battle: 7
    boss: 1
config:
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: true
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: false
  MAP_SIREN_TEMPLATE:
  - BBred
  - CV
  - Kiev
  - Volga
  MAP_HAS_SIREN: true
  STAR_REQUIRE_1: 0
  STAR_REQUIRE_2: 0
  STAR_REQUIRE_3: 0
  MAP_SWIPE_MULTIPLY:
  - 1.064
  - 1.084
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.029
  - 1.048
  MAP_IS_ONE_TIME_STAGE: true
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: clear_siren
    - preserve: 2
      tag: clear_filtered_enemy
    - tag: default_battle
  5:
    steps:
    - tag: clear_siren
    - preserve: 0
      tag: clear_filtered_enemy
    - tag: default_battle
  7:
    steps:
    - strategy: fleet_boss
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination: []
  pickups: []
  map_interactions: []
  moving_enemies:
    turns:
    - 2
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells:
    - E5
    fortress_block_cells:
    - D4
    - D5
    - D6
    - E4
    - E6
    bouncing_enemy_routes: []
programs: []
boss_approaches: []
hard_mode: null
