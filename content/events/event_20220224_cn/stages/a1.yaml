schema_version: 6
map:
  name: A1
  shape: J6
  camera_data:
  - D2
  - D4
  - G2
  - G4
  camera_data_spawn_point:
  - D2
  - D4
  map_data: '++ Me Me ++ ++ ++ ME -- ME ++

    -- -- -- ME -- -- -- -- -- --

    SP -- -- __ -- -- -- -- -- MB

    SP -- -- ME -- -- -- -- -- ME

    ++ -- -- -- ++ -- ME -- ME --

    ++ Me Me ++ ++ ME -- ++ ++ ++'
  weight_data: '50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 1
  - battle: 1
    enemy: 1
  - battle: 2
    enemy: 1
  - battle: 3
    enemy: 1
    boss: 1
  - battle: 4
    enemy: 1
  map_data_loop: '++ Me Me ++ ++ ++ ME -- ME ++

    -- -- -- ME -- -- -- -- -- --

    SP -- -- __ -- MS -- MS -- MB

    SP -- -- ME -- -- -- -- -- ME

    ++ -- -- ME ++ -- ME -- ME --

    ++ Me Me ++ ++ ME -- ++ ++ ++'
  spawn_data_loop:
  - battle: 0
    enemy: 2
    siren: 1
  - battle: 1
    enemy: 1
  - battle: 2
    enemy: 1
  - battle: 3
    enemy: 1
    boss: 1
  - battle: 4
    enemy: 1
config:
  MAP_HAS_MAP_STORY: true
  MAP_HAS_FLEET_STEP: true
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: false
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  MAP_SWIPE_MULTIPLY:
  - 1.111
  - 1.132
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.075
  - 1.094
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: clear_siren
    - tag: clear_filtered_enemy
      preserve: 0
    - tag: default_battle
  3:
    steps:
    - strategy: map_search
      tag: clear_boss_roadblock
    - strategy: map_search
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination: []
  pickups: []
  map_interactions: []
  moving_enemies:
    turns: []
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures:
  - battle: 0
    operations:
    - clear_bouncing_enemy
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells:
    - E3
    fortress_block_cells:
    - E2
    - F2
    - F3
    - E4
    - F4
    bouncing_enemy_routes:
    - - C2
      - C3
      - C4
programs:
- activation_modes:
  - normal
  battle: 0
  statements:
  - action:
      category: procedures
      index: 0
    expected_target: enemy
    tag: attempt_mechanic
  - action:
      genres: []
      tag: clear_siren
    tag: attempt_battle
  - action:
      preserve: 0
      tag: clear_filtered_enemy
    tag: attempt_battle
  - action:
      tag: default_battle
    tag: return_battle
boss_approaches: []
hard_mode: null
