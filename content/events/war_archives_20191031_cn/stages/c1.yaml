schema_version: 5
map:
  name: C1
  shape: I5
  camera_data:
  - D2
  - D3
  - F2
  - F3
  camera_data_spawn_point:
  - D3
  - D2
  map_data: 'SP -- ++ ME -- ME -- ++ --

    -- ME -- -- ME -- Me ++ Me

    -- -- ME -- -- -- __ -- --

    -- ME -- ++ ++ Me -- Me --

    SP -- -- Me ++ -- Me -- MB'
  weight_data: '50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 3
  - battle: 1
    enemy: 2
  - battle: 2
    enemy: 2
  - battle: 3
    enemy: 1
    boss: 1
config:
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: false
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: false
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  MAP_SWIPE_MULTIPLY:
  - 1.064
  - 1.084
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.029
  - 1.048
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - preserve: 0
      tag: clear_filtered_enemy
    - tag: default_battle
  3:
    steps:
    - strategy: map_search
      tag: clear_boss_roadblock
    - strategy: map_search
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination: []
  pickups: []
  map_interactions: []
  map_mutations: []
  moving_enemies:
    turns: []
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs: []
boss_approaches: []
hard_mode: null
