schema_version: 6
map:
  name: SP
  shape: I9
  camera_data:
  - D4
  - D6
  - F4
  - F6
  camera_data_spawn_point:
  - F6
  - D6
  map_data: '++ ++ ++ ++ ++ ++ ++ ++ ++

    ++ MS -- -- MS -- -- MS ++

    ++ -- Me -- -- -- Me -- ++

    ME -- -- ++ -- ++ -- -- ME

    -- ME -- -- MB -- -- ME --

    ME -- -- ++ -- ++ -- -- ME

    ++ -- Me -- __ -- Me -- ++

    ++ ME -- SP -- SP -- ME ++

    ++ ++ ++ ++ -- ++ ++ ++ ++'
  weight_data: '50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 10
    siren: 3
  - battle: 1
  - battle: 2
  - battle: 3
  - battle: 4
  - battle: 5
  - battle: 6
  - battle: 7
    boss: 1
  map_data_loop: '++ ++ ++ ++ ++ ++ ++ ++ ++

    ++ -- -- -- -- -- -- -- ++

    ++ -- Me -- -- -- Me -- ++

    ME -- -- ++ MS ++ -- -- ME

    -- ME -- MS MB MS -- ME --

    ME -- -- ++ -- ++ -- -- ME

    ++ -- Me -- __ -- Me -- ++

    ++ -- -- SP -- SP -- -- ++

    ++ ++ ++ ++ -- ++ ++ ++ ++'
  spawn_data_loop:
  - battle: 0
    enemy: 10
    siren: 3
  - battle: 1
  - battle: 2
  - battle: 3
  - battle: 4
  - battle: 5
  - battle: 6
  - battle: 7
    boss: 1
config:
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: false
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: false
  MAP_SIREN_TEMPLATE:
  - SK_BB
  - SK_CV
  MAP_HAS_SIREN: true
  STAR_REQUIRE_1: 0
  STAR_REQUIRE_2: 0
  STAR_REQUIRE_3: 0
  MAP_SWIPE_MULTIPLY:
  - 1.038
  - 1.058
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.004
  - 1.023
  MAP_IS_ONE_TIME_STAGE: true
  MAP_ENSURE_EDGE_INSIGHT_CORNER: bottom
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: clear_siren
    - preserve: 2
      tag: clear_filtered_enemy
    - tag: default_battle
  5:
    steps:
    - tag: clear_siren
    - preserve: 0
      tag: clear_filtered_enemy
    - tag: default_battle
  7:
    steps:
    - strategy: fleet_boss
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination: []
  pickups: []
  map_interactions: []
  moving_enemies:
    turns:
    - 2
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs: []
boss_approaches: []
hard_mode: null
