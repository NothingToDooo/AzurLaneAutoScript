schema_version: 5
map:
  name: B1
  shape: J8
  camera_data:
  - D2
  - D6
  - G2
  - G6
  camera_data_spawn_point:
  - D6
  map_data: '-- ME -- ++ ++ ++ MB MB MB --

    ME -- MS -- -- -- -- -- -- ++

    ++ ME -- -- ++ Me __ ME -- ++

    ++ -- -- ME -- MS -- -- ME --

    SP -- ++ -- -- -- ++ ++ Me --

    SP -- -- -- ME Me ++ ++ -- ME

    -- -- -- MS ++ -- -- MS -- --

    ++ ++ -- -- ME -- Me -- ME --'
  weight_data: '50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 2
    siren: 1
  - battle: 1
    enemy: 1
  - battle: 2
    enemy: 2
  - battle: 3
    enemy: 1
  - battle: 4
    enemy: 2
    boss: 1
  - battle: 5
    enemy: 1
config:
  MAP_HAS_MAP_STORY: true
  MAP_HAS_FLEET_STEP: true
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: false
  MAP_SIREN_TEMPLATE:
  - DD
  - CL
  MAP_HAS_SIREN: true
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  MAP_SWIPE_MULTIPLY:
  - 1.033
  - 1.053
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 0.999
  - 1.018
  MAP_ENSURE_EDGE_INSIGHT_CORNER: bottom
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - condition:
        flag: clear_mode
        tag: flag
        value: true
      step:
        genres: []
        tag: clear_siren
      tag: guarded
    - condition:
        flag: clear_mode
        tag: flag
        value: true
      step:
        preserve: 0
        tag: clear_filtered_enemy
      tag: guarded
    - condition:
        condition:
          flag: clear_mode
          tag: flag
          value: true
        tag: not
      step:
        genres: []
        sort:
        - cost_2
        strongest: false
        tag: clear_any_enemy
      tag: guarded
    - tag: default_battle
  4:
    steps:
    - strategy: map_search
      tag: clear_boss_roadblock
    - strategy: map_search
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination: []
  pickups: []
  map_interactions: []
  map_mutations: []
  moving_enemies:
    turns:
    - 2
    normal_turns:
    - 2
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs: []
boss_approaches: []
hard_mode: null
