schema_version: 5
map:
  name: D3
  shape: L6
  camera_data:
  - E3
  - G4
  - I3
  camera_data_spawn_point:
  - D4
  map_data: '++ ++ -- -- -- ME ME -- -- -- ++ ++

    ++ -- ++ ++ Me -- -- MS ++ ++ ++ ++

    -- Me Me ++ -- ME ++ -- ++ -- -- MB

    -- -- __ -- MS -- ++ -- -- MS -- MB

    SP -- -- Me ++ ++ ME -- ME -- ++ ++

    -- SP -- ++ ++ ++ -- ME -- ME ++ ++'
  weight_data: '50 50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 2
    siren: 3
  - battle: 1
    enemy: 1
  - battle: 2
    enemy: 2
  - battle: 3
    enemy: 1
  - battle: 4
    enemy: 2
  - battle: 5
    enemy: 1
  - battle: 6
    boss: 1
  map_data_loop: '++ ++ -- -- Me ME ME Me -- -- ++ ++

    ++ -- ++ ++ -- -- -- -- ++ ++ ++ ++

    -- MS Me ++ -- MS ++ -- ++ ME -- MB

    -- -- __ -- -- MS ++ -- -- -- -- MB

    SP -- -- Me ++ ++ ME -- ME -- ++ ++

    -- SP -- ++ ++ ++ -- ME -- ME ++ ++'
  spawn_data_loop:
  - battle: 0
    enemy: 2
    siren: 2
  - battle: 1
    enemy: 1
  - battle: 2
    enemy: 2
    siren: 1
  - battle: 3
    enemy: 1
  - battle: 4
    enemy: 2
  - battle: 5
    enemy: 1
  - battle: 6
    boss: 1
config:
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: true
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: false
  MAP_SIREN_TEMPLATE:
  - Lover
  MAP_HAS_SIREN: true
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  MAP_SWIPE_MULTIPLY:
  - 1.123
  - 1.144
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.086
  - 1.106
  MAP_ENSURE_EDGE_INSIGHT_CORNER: bottom
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - condition:
        flag: clear_mode
        tag: flag
        value: true
      step:
        genres: []
        tag: clear_siren
      tag: guarded
    - condition:
        flag: clear_mode
        tag: flag
        value: true
      step:
        preserve: 1
        tag: clear_filtered_enemy
      tag: guarded
    - condition:
        condition:
          flag: clear_mode
          tag: flag
          value: true
        tag: not
      step:
        genres: []
        tag: clear_siren
      tag: guarded
    - tag: default_battle
  5:
    steps:
    - condition:
        flag: clear_mode
        tag: flag
        value: true
      step:
        genres: []
        tag: clear_siren
      tag: guarded
    - condition:
        flag: clear_mode
        tag: flag
        value: true
      step:
        preserve: 0
        tag: clear_filtered_enemy
      tag: guarded
    - condition:
        condition:
          flag: clear_mode
          tag: flag
          value: true
        tag: not
      step:
        genres: []
        tag: clear_siren
      tag: guarded
    - tag: default_battle
  6:
    steps:
    - strategy: fleet_boss
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination: []
  pickups: []
  map_interactions: []
  map_mutations: []
  moving_enemies:
    turns: []
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs: []
boss_approaches: []
hard_mode: null
