schema_version: 4
map:
  name: SP4
  shape: I8
  camera_data:
  - D2
  - D6
  - F2
  - F6
  camera_data_spawn_point:
  - F6
  - D6
  map_data: '-- -- ME ++ ++ ++ ME -- --

    ++ ME -- -- Me -- -- ME ++

    ME -- ME -- ++ -- ME -- ME

    ME -- ++ -- MB -- ++ -- ME

    ME -- ++ MS -- MS ++ -- ME

    ++ -- Me -- __ -- Me -- ++

    ME -- MS -- -- -- MS -- ME

    ++ ++ ++ SP -- SP ++ ++ ++'
  weight_data: '50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 3
    siren: 2
  - battle: 1
    enemy: 2
    siren: 1
  - battle: 2
    enemy: 1
  - battle: 3
    enemy: 1
  - battle: 4
  - battle: 5
    boss: 1
config:
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: true
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: false
  MAP_SIREN_TEMPLATE:
  - MisakiDOA
  - KasumiDOA
  - NagisaDOA
  MAP_HAS_SIREN: true
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  STAGE_ENTRANCE:
  - normal
  - half
  MAP_HAS_MODE_SWITCH: false
  MAP_SWIPE_MULTIPLY:
  - 1.064
  - 1.084
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.029
  - 1.048
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: clear_siren
    - tag: clear_filtered_enemy
      preserve: 0
    - tag: default_battle
  5:
    steps:
    - strategy: fleet_boss
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination:
  - battle: 0
    fleet: fleet_2
    tag: protect
  pickups: []
  map_interactions: []
  map_mutations: []
  moving_enemies:
    turns:
    - 2
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures: []
  preset_routes: []
  fixed_target_sequences: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs:
- activation_modes:
  - normal
  battle: 0
  statements:
  - action:
      category: fleet_coordination
      index: 0
    expected_target: any
    tag: attempt_mechanic
  - action:
      genres: []
      tag: clear_siren
    tag: attempt_battle
  - action:
      preserve: 0
      tag: clear_filtered_enemy
    tag: attempt_battle
  - action:
      tag: default_battle
    tag: return_battle
boss_approaches: []
hard_mode: null
