schema_version: 5
map:
  name: SP
  shape: I6
  camera_data:
  - E4
  - E3
  camera_data_spawn_point:
  - E4
  map_data: '++ ++ ++ ++ MB ++ ++ ++ ++

    ++ -- ME -- MS -- ME -- ++

    -- ME -- MS -- MS -- ME --

    ++ -- ME -- __ -- ME -- ++

    -- ++ ++ -- -- -- ++ ++ --

    -- ++ ++ SP -- SP ++ ++ --'
  weight_data: '50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    siren: 3
  - battle: 1
    enemy: 1
  - battle: 2
    enemy: 1
  - battle: 3
    enemy: 2
  - battle: 4
  - battle: 5
  - battle: 6
  - battle: 7
    boss: 1
config:
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: false
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: false
  MAP_SIREN_TEMPLATE:
  - KasumiDOA
  - NagisaDOA
  - NyotenguDOA
  MAP_HAS_SIREN: true
  STAR_REQUIRE_1: 0
  STAR_REQUIRE_2: 0
  STAR_REQUIRE_3: 0
  MAP_SWIPE_MULTIPLY:
  - 1.064
  - 1.084
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.029
  - 1.048
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: clear_siren
    - preserve: 2
      tag: clear_filtered_enemy
    - tag: default_battle
  5:
    steps:
    - preserve: 0
      tag: clear_filtered_enemy
    - tag: default_battle
  7:
    steps:
    - strategy: fleet_boss
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination: []
  pickups: []
  map_interactions: []
  map_mutations: []
  moving_enemies:
    turns: []
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs: []
boss_approaches: []
hard_mode: null
