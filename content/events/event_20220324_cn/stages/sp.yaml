schema_version: 5
map:
  name: SP
  shape: K8
  camera_data:
  - D4
  - D6
  - H4
  - H6
  camera_data_spawn_point:
  - H6
  - D6
  map_data: '-- -- -- -- ++ ++ ++ -- -- -- --

    -- -- -- -- ++ ++ ++ -- ++ ++ --

    -- ++ ++ Me -- MB -- Me ++ ++ --

    ME -- ME -- -- -- -- -- ME -- ME

    -- -- ++ ++ -- MS -- ++ ++ -- --

    -- ME ++ ++ MS __ MS ++ ++ ME --

    ME -- Me -- -- -- -- -- Me -- ME

    -- ME -- -- SP -- SP -- -- ME --'
  weight_data: '50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 3
    siren: 2
  - battle: 1
    enemy: 2
    siren: 1
  - battle: 2
    enemy: 2
  - battle: 3
    enemy: 1
  - battle: 4
  - battle: 5
  - battle: 6
  - battle: 7
