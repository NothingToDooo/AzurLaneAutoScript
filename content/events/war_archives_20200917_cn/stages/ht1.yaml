schema_version: 4
map:
  name: HT1
  shape: K7
  camera_data:
  - D3
  - D5
  - H3
  - H5
  camera_data_spawn_point:
  - H5
  - D5
  map_data: '-- -- ++ -- -- MB -- -- ++ -- --

    -- ++ ++ ++ Me -- Me ++ ++ ++ --

    ++ Me -- ++ ++ -- ++ ++ -- Me ++

    ME -- ME ++ ++ -- ++ ++ ME -- ME

    -- -- -- ME MS -- MS ME -- -- --

    ME -- MS -- -- __ -- -- MS -- ME

    ++ Me -- -- SP -- SP -- -- Me ++'
  weight_data: '50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 2
    siren: 2
  - battle: 1
    enemy: 1
  - battle: 2
    enemy: 2
  - battle: 3
    enemy: 1
  - battle: 4
    enemy: 1
    boss: 1
config:
  MAP_HAS_MAP_STORY: true
  MAP_HAS_FLEET_STEP: true
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: true
  MAP_SIREN_TEMPLATE:
  - CL
  - SS
  MAP_HAS_SIREN: true
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  STAGE_ENTRANCE:
  - blue
  MAP_HAS_MODE_SWITCH: false
  MAP_SWIPE_MULTIPLY:
  - 1.064
  - 1.084
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.029
  - 1.048
  MAP_ENSURE_EDGE_INSIGHT_CORNER: bottom
enemy_filter: 1T > 1L > 1E > 1M > 2T > 2L > 2E > 2M > 3T > 3L > 3E > 3M
battles:
  0:
    steps:
    - tag: clear_siren
    - tag: default_battle
  4:
    steps:
    - strategy: map_search
      tag: clear_boss_roadblock
    - strategy: map_search
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination:
  - battle: 0
    fleet: fleet_2
    tag: protect
  pickups: []
  map_interactions: []
  map_mutations: []
  moving_enemies:
    turns:
    - 2
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures: []
  preset_routes: []
  fixed_target_sequences: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs:
- activation_modes:
  - normal
  battle: 0
  statements:
  - action:
      category: fleet_coordination
      index: 0
    expected_target: any
    tag: attempt_mechanic
  - action:
      genres: []
      tag: clear_siren
    tag: attempt_battle
  - action:
      tag: default_battle
    tag: return_battle
boss_approaches: []
hard_mode: null
