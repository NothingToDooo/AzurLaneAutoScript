    ME -- Me __ -- -- MB ++

    -- -- -- -- ME -- ++ ME

    ++ ME ++ -- -- -- MS --

    -- ++ Me Me -- Me -- ME

    MS -- -- -- -- -- -- ++

    -- ME ++ ++ SP SP -- MS'
