schema_version: 4
map:
  name: D3
  shape: L9
  camera_data:
  - D2
  - D6
  - D7
  - I2
  - I6
  - I7
  camera_data_spawn_point:
  - D7
  map_data: '-- -- -- ++ ++ ++ ME -- ME MM ++ ++

    -- -- -- -- MB ME -- Me ++ ME ++ ++

    -- -- Me -- -- -- -- __ -- MS -- ME

    -- -- -- MS -- -- ME -- -- -- MM --

    -- ME MB ++ -- Me ++ -- -- ME -- --

    ++ ++ ++ ME -- -- ME -- ++ -- MB --

    SP -- -- -- -- -- -- __ ++ -- -- --

    -- SP -- -- -- Me MS -- -- -- ME --

    -- -- SP -- -- ++ ME -- -- ME -- ++'
  weight_data: '50 50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 4
    siren: 2
  - battle: 1
    enemy: 1
    siren: 1
  - battle: 2
    enemy: 1
    mystery: 1
  - battle: 3
    enemy: 1
  - battle: 4
    enemy: 1
  - battle: 5
  - battle: 6
    boss: 1
config:
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: true
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: true
  MAP_SIREN_TEMPLATE:
  - DD
  - CL
  - CA
  MAP_HAS_SIREN: true
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  MAP_SWIPE_MULTIPLY:
  - 1.064
  - 1.084
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.029
  - 1.048
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: clear_siren
    - tag: clear_filtered_enemy
      preserve: 0
    - tag: default_battle
  5:
    steps:
    - tag: clear_siren
    - tag: clear_filtered_enemy
      preserve: 0
    - tag: default_battle
  6:
    steps:
    - strategy: fleet_boss
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination: []
  pickups: []
  map_interactions:
  - battle: 0
    ignored: []
    nearby: true
    tag: clear_all_mystery
  - battle: 5
    ignored: []
    nearby: true
    tag: clear_all_mystery
  map_mutations: []
  moving_enemies:
    turns:
    - 2
    - 3
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures: []
  preset_routes: []
  fixed_target_sequences: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs:
- activation_modes:
  - normal
  battle: 0
  statements:
  - action:
      category: map_interactions
      index: 0
    expected_target: null
    tag: perform_mechanic
  - action:
      genres: []
      tag: clear_siren
    tag: attempt_battle
  - action:
      preserve: 1
      tag: clear_filtered_enemy
    tag: attempt_battle
  - action:
      tag: default_battle
    tag: return_battle
- activation_modes:
  - normal
  battle: 5
  statements:
  - action:
      category: map_interactions
      index: 1
    expected_target: null
    tag: perform_mechanic
  - action:
      genres: []
      tag: clear_siren
    tag: attempt_battle
  - action:
      preserve: 0
      tag: clear_filtered_enemy
    tag: attempt_battle
  - action:
      tag: default_battle
    tag: return_battle
boss_approaches: []
hard_mode: null
