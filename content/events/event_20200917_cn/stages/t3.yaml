    -- -- MB -- -- -- -- -- --

    ++ ++ ++ -- -- ++ ++ -- ME

    -- MS -- Me -- Me ++ -- --

    ME -- ++ -- __ -- -- -- ME

    -- -- SP -- -- Me -- -- --

