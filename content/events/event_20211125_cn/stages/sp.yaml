schema_version: 6
map:
  name: SP
  shape: H8
  camera_data:
  - D2
  - D6
  - E2
  - E6
  camera_data_spawn_point:
  - E6
  map_data: '++ MB -- ++ ++ -- Me --

    ++ -- -- -- Me -- -- --

    ME ++ MS __ -- -- ++ ++

    -- -- -- ++ ++ MS -- ME

    Me -- MS ++ ++ -- -- --

    ++ ++ -- -- __ MS ++ ME

    -- -- -- Me -- -- -- ++

    -- Me -- ++ ++ SP SP ++'
  weight_data: '50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    siren: 2
  - battle: 1
    enemy: 1
    siren: 2
  - battle: 2
    enemy: 1
  - battle: 3
    enemy: 2
  - battle: 4
  - battle: 5
  - battle: 6
  - battle: 7
    boss: 1
config:
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: true
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: false
  MAP_SIREN_TEMPLATE:
  - GridmanCL
  - GridmanCA
  MAP_HAS_SIREN: true
  STAR_REQUIRE_1: 0
  STAR_REQUIRE_2: 0
  STAR_REQUIRE_3: 0
  MAP_SWIPE_MULTIPLY:
  - 0.976
  - 0.995
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 0.944
  - 0.962
  MAP_ENSURE_EDGE_INSIGHT_CORNER: bottom-left
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: clear_siren
    - preserve: 2
      tag: clear_filtered_enemy
    - tag: default_battle
  5:
    steps:
    - tag: clear_siren
    - preserve: 0
      tag: clear_filtered_enemy
    - tag: default_battle
  7:
    steps:
    - strategy: fleet_boss
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination: []
  pickups: []
  map_interactions: []
  moving_enemies:
    turns:
    - 2
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs: []
boss_approaches: []
hard_mode: null
