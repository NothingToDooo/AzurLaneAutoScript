  shape: I7
  camera_data:
  - D2
  - D5
  - F3
  - F5
  camera_data_spawn_point:
  - D2
  - D5
  map_data: 'MS -- -- ++ ++ -- -- -- --

    -- Me ME MS ++ -- ME -- --

    SP -- -- -- -- ME ++ ++ ++

    -- Me -- ++ -- -- -- -- MB

    SP -- ME __ -- ME ++ ++ ++

    Me -- ++ Me ME -- -- -- --

    -- Me ++ -- ME MS ME -- --'
  weight_data: '10 10 10 10 10 10 10 10 10

    10 10 10 10 10 10 10 10 10

    10 10 10 10 10 10 10 10 10

    10 10 10 10 10 10 10 10 10

    10 10 10 10 10 10 10 10 10

    05 04 10 10 10 10 10 10 10

    10 10 10 10 10 10 10 10 10'
  spawn_data:
