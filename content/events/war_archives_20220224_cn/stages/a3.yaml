schema_version: 4
map:
  name: A3
  shape: I9
  camera_data:
  - E3
  - E5
  - E7
  camera_data_spawn_point:
  - E7
  map_data: '++ ++ ++ -- MB -- ++ ++ ++

    ++ -- -- -- -- -- -- -- ++

    -- ME -- ME ++ ME -- ME --

    -- -- -- -- -- -- -- -- --

    -- ME -- -- -- -- -- ME --

    ++ ++ -- -- -- -- -- ++ ++

    ++ ++ Me -- Me -- Me ++ ++

    ++ Me -- -- __ -- -- Me ++

    ++ -- -- SP -- SP -- -- ++'
  weight_data: '50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 1
  - battle: 1
  - battle: 2
    enemy: 1
  - battle: 3
    enemy: 1
  - battle: 4
    enemy: 1
    boss: 1
  map_data_loop: '++ ++ ++ -- MB -- ++ ++ ++

    ++ -- -- -- -- -- -- -- ++

    -- ME -- ME ++ ME -- ME --

    -- -- -- -- -- -- -- -- --

    -- ME -- ME -- ME -- ME --

    ++ ++ -- MS -- MS -- ++ ++

    ++ ++ Me -- Me -- Me ++ ++

    ++ Me -- -- __ -- -- Me ++

    ++ -- -- SP -- SP -- -- ++'
  spawn_data_loop:
  - battle: 0
    enemy: 2
    siren: 1
  - battle: 1
    enemy: 1
  - battle: 2
    enemy: 1
  - battle: 3
    enemy: 1
  - battle: 4
    enemy: 1
    boss: 1
config:
  MAP_HAS_MAP_STORY: true
  MAP_HAS_FLEET_STEP: true
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: false
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  MAP_SWIPE_MULTIPLY:
  - 0.993
  - 1.012
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 0.961
  - 0.978
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: clear_siren
    - tag: clear_filtered_enemy
      preserve: 0
    - tag: default_battle
  4:
    steps:
    - strategy: map_search
      tag: clear_boss_roadblock
    - strategy: map_search
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination: []
  pickups: []
  map_interactions: []
  map_mutations: []
  moving_enemies:
    turns: []
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures:
  - battle: 0
    operations:
    - clear_bouncing_enemy
  preset_routes: []
  fixed_target_sequences: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells:
    - D6
    - F6
    fortress_block_cells:
    - C5
    - D5
    - E5
    - F5
    - G5
    - C6
    - E6
    - G6
    bouncing_enemy_routes:
    - - C4
      - D4
      - E4
      - F4
      - G4
programs:
- activation_modes:
  - normal
  battle: 0
  statements:
  - action:
      category: procedures
      index: 0
    expected_target: enemy
    tag: attempt_mechanic
  - action:
      genres: []
      tag: clear_siren
    tag: attempt_battle
  - action:
      preserve: 0
      tag: clear_filtered_enemy
    tag: attempt_battle
  - action:
      tag: default_battle
    tag: return_battle
boss_approaches: []
hard_mode: null
