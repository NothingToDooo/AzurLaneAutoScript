        flag: clear_mode
        tag: flag
        value: true
      step:
        genres: []
        tag: clear_siren
      tag: guarded
    - tag: default_battle
  5:
    steps:
    - strategy: fleet_boss
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination: []
  pickups: []
  map_interactions: []
  map_mutations: []
  moving_enemies:
