schema_version: 4
map:
  name: A3
  shape: H8
  camera_data:
  - D3
  - D6
  camera_data_spawn_point:
  - D6
  map_data: '-- ++ ++ -- ME ME -- ++

    ME ++ ++ ME -- -- MB --

    -- Me Me -- -- ME -- ME

    -- -- -- -- __ -- -- ME

    -- MS ++ ++ -- -- ME --

    -- -- MS ++ -- Me ++ ++

    SP -- -- MS -- Me ++ ++

    ++ SP -- -- -- -- ME --'
  weight_data: '50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50'
  spawn_data:
  - battle: 0
    enemy: 2
    siren: 1
  - battle: 1
    enemy: 1
  - battle: 2
    enemy: 1
  - battle: 3
    enemy: 1
  - battle: 4
    enemy: 1
    boss: 1
config:
  MAP_HAS_MAP_STORY: true
  MAP_HAS_FLEET_STEP: true
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: false
  MAP_SIREN_TEMPLATE:
  - Asanagi
  - Hatsuzuki
  MAP_HAS_SIREN: true
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  MAP_SWIPE_MULTIPLY:
  - 1.091
  - 1.111
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.055
  - 1.074
  MAP_ENSURE_EDGE_INSIGHT_CORNER: bottom
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
  0:
    steps:
    - tag: clear_siren
    - preserve: 0
      tag: clear_filtered_enemy
    - tag: default_battle
  4:
    steps:
    - strategy: map_search
      tag: clear_boss_roadblock
    - strategy: map_search
      tag: clear_boss
mechanics:
  roadblocks: []
  fleet_coordination: []
  pickups: []
  map_interactions: []
  map_mutations: []
  moving_enemies:
    turns:
    - 2
    normal_turns: []
    wait_until_clear: false
    initial_enemy_cells: []
    initial_siren_cells: []
  enemy_movement: []
  procedures: []
  preset_routes: []
  fixed_target_sequences: []
  map_structures:
    walls: []
    maze_groups: []
    fortress_enemy_cells: []
    fortress_block_cells: []
    bouncing_enemy_routes: []
programs: []
boss_approaches: []
hard_mode: null
