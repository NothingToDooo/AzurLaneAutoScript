    50 50 50 50 50 50 50 50 50 50

    50 50 50 50 50 50 50 50 50 50

    50 10 10 10 10 50 50 50 50 50

    50 10 90 90 10 50 50 50 50 50

    50 10 90 90 10 50 50 50 50 50'
  spawn_data:
