  MAP_HAS_FLEET_STEP: true
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: true
  MAP_SIREN_TEMPLATE:
  - Dorsetshire
  - Rodney
  - ArkRoyal
  MAP_HAS_SIREN: true
  STAR_REQUIRE_1: 1
  STAR_REQUIRE_2: 2
  STAR_REQUIRE_3: 3
  MAP_SWIPE_MULTIPLY:
  - 1.196
  - 1.218
  MAP_SWIPE_MULTIPLY_MINITOUCH:
  - 1.156
  - 1.178
  MAP_ENSURE_EDGE_INSIGHT_CORNER: bottom
enemy_filter: 1L > 1M > 1E > 1C > 2L > 2M > 2E > 2C > 3L > 3M > 3E > 3C
battles:
