    "TRY003",
    "TRY004",
    "TRY201",
    "TRY203",
    "TRY300",
    "TRY301",
    "TRY400",
    "TRY401",
    "UP",
    "W",
    "YTT",
]
ignore = [
    # 中文注释和文案使用全角标点，不能启用歧义 Unicode 标点规则。
    "RUF001",
    "RUF002",
    "RUF003",
    # 点击、等待和重试抖动不是安全用途，保留非安全随机数。
    "S311",
]
per-file-ignores = { "dev_tools/**/*.py" = ["T201"], "tests/**/*.py" = ["S101"] }

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["cached_class_property"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = [
    "campaign/**",
    "dev_tools/**",
    "submodule/**",
]

[tool.ty.rules]
# 当前动态历史代码的初始基线；后续按模块逐步收紧。
call-non-callable = "ignore"
deprecated = "ignore"
empty-body = "ignore"
index-out-of-bounds = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
invalid-parameter-default = "ignore"
invalid-return-type = "ignore"
invalid-super-argument = "ignore"
invalid-type-form = "ignore"
missing-argument = "ignore"
no-matching-overload = "ignore"
not-iterable = "ignore"
not-subscriptable = "ignore"
possibly-missing-submodule = "ignore"
unbound-type-variable = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"
unsupported-operator = "ignore"
