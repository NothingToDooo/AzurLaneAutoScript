[project]
name = "azur-lane-auto-script"
version = "0.1.0"
description = "Personal AzurLaneAutoScript fork"
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "opencv-python",
    "imageio",
    "adbutils",
    "uiautomator2",
    "psutil",
    "rich",
    "tqdm",
    "pyyaml",
    "inflection",
    "pydantic",
    "aiofiles",
    "onepush",
    "pypresence",
    "cnocr",
    "pywebio",
    "starlette",
    "onnxruntime>=1.27.0",
    "uvicorn>=0.50.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "ty",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "A",
    "ARG001",
    "ARG003",
    "B",
    "BLE001",
    "C4",
    "DTZ002",
    "DTZ006",
    "DTZ011",
    "E711",
    "E712",
    "E713",
    "E714",
    "E721",
    "E722",
    "E731",
    "E741",
    "F",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "NPY",
    "PLE",
    "PERF",
    "PGH",
    "PIE",
    "PT",
    "PLC0206",
    "PLC1802",
    "PLR0402",
    "PLR1704",
    "PLR1711",
    "PLR1714",
    "PLR1722",
    "PLR1730",
    "PLR5501",
    "PLW",
    "PTH",
    "Q",
    "RUF005",
    "RUF006",
    "RUF007",
    "RUF010",
    "RUF013",
    "RUF017",
    "RUF019",
    "RUF021",
    "RUF046",
    "RUF059",
    "RUF100",
    "RSE",
    "RET",
    "S110",
    "S324",
    "S602",
    "S603",
    "S605",
    "SIM",
    "SLOT",
    "TCH",
    "TRY002",
    "TRY201",
    "TRY300",
    "TRY301",
    "TRY401",
    "UP",
    "W",
    "YTT",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = [
    "campaign/**",
    "dev_tools/**",
    "submodule/**",
]

[tool.ty.rules]
# 当前动态历史代码的初始基线；后续按模块逐步收紧。
call-non-callable = "ignore"
deprecated = "ignore"
empty-body = "ignore"
index-out-of-bounds = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
invalid-parameter-default = "ignore"
invalid-return-type = "ignore"
invalid-super-argument = "ignore"
invalid-type-form = "ignore"
missing-argument = "ignore"
no-matching-overload = "ignore"
not-iterable = "ignore"
not-subscriptable = "ignore"
possibly-missing-submodule = "ignore"
unbound-type-variable = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"
unsupported-operator = "ignore"
