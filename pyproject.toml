ignore = [
    # 国区个人分支统一使用本机本地时间，保留 naive datetime。
    "DTZ001",
    "DTZ005",
    # 中文注释和文案使用全角标点，不能启用歧义 Unicode 标点规则。
    "RUF001",
    "RUF002",
    "RUF003",
    # 点击、等待和重试抖动不是安全用途，保留非安全随机数。
    "S311",
]
[tool.ruff.lint.per-file-ignores]
"dev_tools/**/*.py" = ["T201"]
"tests/**/*.py" = ["S101"]
# 脚本路径入口必须先补仓库根目录，才能导入顶层 module 包。
"module/config/config_updater.py" = ["E402"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["cached_class_property"]

[tool.ty.environment]
python-version = "3.14"
