[project]
name = "azur-lane-auto-script"
version = "0.1.0"
description = "Personal AzurLaneAutoScript fork"
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "opencv-python",
    "imageio",
    "adbutils",
    "psutil",
    "rich",
    "pyyaml",
    "cnocr",
    "pywebio>=1.8.4",
    "starlette",
    "onnxruntime>=1.27.0",
    "uvicorn>=0.50.2",
    "websockets>=16.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "tqdm>=4.68.3",
    "ty",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
namespace-packages = ["module"]
target-version = "py314"

[tool.ruff.lint]
# 全量启用稳定和预览规则，未采用的规则集中在 ignore 中排除。
preview = true
explicit-preview-rules = false
select = ["ALL"]
ignore = [
    "missing-trailing-comma",
    "CPY",
    "D",
    "DOC",
    "call-datetime-without-tzinfo",
    "call-datetime-now-without-tzinfo",
    "reimplemented-starmap",
    "error-suffix-on-exception-name",
    "compare-to-empty-string",
    "too-many-public-methods",
    "magic-value-comparison",
    "literal-membership",
    "ambiguous-unicode-character-string",
    "ambiguous-unicode-character-docstring",
    "ambiguous-unicode-character-comment",
    "incorrectly-parenthesized-tuple-in-subscript",
]
[tool.ruff.lint.per-file-ignores]
"dev_tools/**/*.py" = ["implicit-namespace-package"]
"dev_tools/emulator_test.py" = ["print"]
"dev_tools/map_extractor.py" = ["print"]
"dev_tools/os_extract.py" = ["print"]
"dev_tools/research_extractor.py" = ["print"]
"dev_tools/utils.py" = ["print"]
"module/device/platform/utils.py" = ["invalid-class-name"]
"module/game_setting/setting_generated.py" = ["mixed-case-variable-in-class-scope"]
"tests/test_adb_session_start_server.py" = ["suspicious-subprocess-import"]
"tests/test_campaign_runtime_profile_manager.py" = ["float-equality-comparison"]
"tests/test_configuration_compiler.py" = ["float-equality-comparison"]
"tests/test_device_imports.py" = ["suspicious-subprocess-import"]
"tests/test_device_screenshot_interval.py" = ["float-equality-comparison"]
"tests/test_grid_predictor_enemy_genre.py" = ["float-equality-comparison"]
"tests/test_gui_cli.py" = ["suspicious-subprocess-import"]
"tests/test_map_operation_helpers.py" = ["float-equality-comparison"]
"tests/test_ocr_result.py" = ["float-equality-comparison"]
"tests/test_stage_spec_loader.py" = ["float-equality-comparison"]
"tests/test_task_registry.py" = ["suspicious-subprocess-import"]
"tests/test_webui_app.py" = ["float-equality-comparison"]
"tests/test_webui_utils.py" = ["import-private-name"]
"tests/**/*.py" = ["assert", "implicit-namespace-package"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["cached_class_property"]

[tool.ruff.lint.pylint]
max-bool-expr = 6
max-locals = 20
max-nested-blocks = 6
max-statements-in-try = 20

[tool.ty.environment]
python-version = "3.14"
