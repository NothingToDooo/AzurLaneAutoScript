[project]
name = "azur-lane-auto-script"
version = "0.1.0"
description = "Personal AzurLaneAutoScript fork"
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "opencv-python",
    "imageio",
    "adbutils",
    "uiautomator2",
    "uiautomator2cache",
    "psutil",
    "rich",
    "tqdm",
    "pyyaml",
    "inflection",
    "pydantic",
    "aiofiles",
    "onepush",
    "pypresence",
    "cnocr",
    "pywebio",
    "starlette",
    "zerorpc",
    "pyzmq",
    "cached-property>=2.0.1",
    "onnxruntime>=1.27.0",
    "uvicorn>=0.50.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "A",
    "ARG003",
    "B",
    "C4",
    "DTZ002",
    "DTZ006",
    "DTZ011",
    "E711",
    "E712",
    "E713",
    "E714",
    "E721",
    "E722",
    "E731",
    "E741",
    "F",
    "I",
    "ICN",
    "PLE",
    "PERF",
    "PIE",
    "PLC0206",
    "PLC1802",
    "PLW0120",
    "PLW0127",
    "PLW3301",
    "RUF006",
    "RUF007",
    "RUF010",
    "RUF013",
    "RUF017",
    "RUF019",
    "RUF021",
    "RUF046",
    "RUF059",
    "RUF100",
    "RET501",
    "RET502",
    "RET506",
    "SIM105",
    "SIM109",
    "SIM110",
    "SIM113",
    "SIM114",
    "SIM115",
    "SIM116",
    "SIM118",
    "SIM201",
    "SIM210",
    "SIM211",
    "SIM212",
    "SIM220",
    "SIM221",
    "SIM222",
    "SIM223",
    "SIM300",
    "SLOT",
    "UP004",
    "UP006",
    "UP007",
    "UP008",
    "UP015",
    "UP017",
    "UP025",
    "UP028",
    "UP032",
    "UP034",
    "UP035",
    "UP037",
    "UP039",
    "UP041",
    "UP045",
    "UP046",
    "W",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = [
    "campaign/**",
    "dev_tools/**",
    "submodule/**",
]

[tool.ty.rules]
# 当前动态历史代码的初始基线；后续按模块逐步收紧。
call-non-callable = "ignore"
deprecated = "ignore"
empty-body = "ignore"
index-out-of-bounds = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
invalid-parameter-default = "ignore"
invalid-return-type = "ignore"
invalid-super-argument = "ignore"
invalid-type-form = "ignore"
missing-argument = "ignore"
no-matching-overload = "ignore"
not-iterable = "ignore"
not-subscriptable = "ignore"
possibly-missing-submodule = "ignore"
unbound-type-variable = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"
unsupported-operator = "ignore"
