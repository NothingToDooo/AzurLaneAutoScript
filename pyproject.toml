[project]
name = "azur-lane-auto-script"
version = "0.1.0"
description = "Personal AzurLaneAutoScript fork"
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "opencv-python",
    "imageio",
    "adbutils",
    "psutil",
    "rich",
    "pyyaml",
    "cnocr",
    "pywebio",
    "starlette",
    "onnxruntime>=1.27.0",
    "uvicorn>=0.50.2",
    "websockets>=16.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "tqdm>=4.68.3",
    "ty",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# 预览规则按代码逐条启用，升级 Ruff 时显式处理规则变化。
