    "B005",
    "B006",
    "B007",
    "B008",
    "B009",
    "B010",
    "B011",
    "B012",
    "B013",
    "B014",
    "B015",
    "B016",
    "B018",
    "B020",
    "B023",
    "B024",
    "B026",
    "B027",
    "B028",
    "B032",
    "B904",
    "B905",
    "C400",
    "C401",
    "C402",
    "C403",
    "C404",
    "C405",
    "C406",
    "C408",
    "C409",
    "C410",
    "C411",
    "C413",
    "C414",
    "C415",
    "C416",
    "C419",
    "E711",
    "E713",
    "E712",
    "E714",
    "E721",
    "E722",
    "E731",
    "F821",
    "F601",
    "F602",
    "F541",
    "F823",
    "F841",
    "F842",
    "I",
    "PIE808",
    "PLW0120",
    "PLW0127",
    "PLW3301",
    "RUF006",
    "RUF010",
    "RUF017",
    "RUF019",
    "RUF021",
    "RUF046",
    "RUF100",
    "SIM105",
