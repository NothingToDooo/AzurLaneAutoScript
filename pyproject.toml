[project]
name = "azur-lane-auto-script"
version = "0.1.0"
description = "Personal AzurLaneAutoScript fork"
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "opencv-python",
    "imageio",
    "adbutils",
    "uiautomator2",
    "uiautomator2cache",
    "psutil",
    "rich",
    "tqdm",
    "pyyaml",
    "inflection",
    "pydantic",
    "aiofiles",
    "onepush",
    "pypresence",
    "cnocr",
    "pywebio",
    "starlette",
    "zerorpc",
    "pyzmq",
    "cached-property>=2.0.1",
    "onnxruntime>=1.27.0",
    "uvicorn>=0.50.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
