[project]
name = "azur-lane-auto-script"
version = "0.1.0"
description = "Personal AzurLaneAutoScript fork"
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "opencv-python",
    "imageio",
    "adbutils",
    "uiautomator2",
    "uiautomator2cache",
    "wrapt",
    "retrying",
    "lz4",
    "av",
    "psutil",
    "rich",
    "tqdm",
    "jellyfish",
    "pyyaml",
    "inflection",
    "pydantic",
    "aiofiles",
    "prettytable",
    "anyio",
    "onepush",
    "pycryptodome",
    "pypresence",
    "cnocr",
    "pywebio",
    "starlette",
    "uvicorn[standard]",
    "zerorpc",
    "pyzmq",
    "cached-property>=2.0.1",
    "onnxruntime>=1.27.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E713",
    "F541",
    "I",
    "RUF100",
    "UP004",
    "UP008",
    "UP015",
    "UP025",
    "UP032",
    "UP034",
    "UP037",
    "UP039",
    "UP041",
]
ignore = [
    "E501",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = [
    "campaign/**",
    "dev_tools/**",
    "submodule/**",
]

[tool.ty.rules]
# 当前动态历史代码的初始基线；后续按模块逐步收紧。
call-non-callable = "ignore"
deprecated = "ignore"
empty-body = "ignore"
index-out-of-bounds = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
invalid-parameter-default = "ignore"
invalid-return-type = "ignore"
invalid-super-argument = "ignore"
invalid-type-form = "ignore"
missing-argument = "ignore"
no-matching-overload = "ignore"
not-iterable = "ignore"
not-subscriptable = "ignore"
possibly-missing-submodule = "ignore"
unbound-type-variable = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"
unsupported-operator = "ignore"
