[project]
name = "azur-lane-auto-script"
version = "0.1.0"
description = "Personal AzurLaneAutoScript fork"
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "opencv-python",
    "imageio",
    "adbutils",
    "psutil",
    "rich",
    "pyyaml",
    "cnocr",
    "pywebio",
    "starlette",
    "onnxruntime>=1.27.0",
    "uvicorn>=0.50.2",
    "websockets>=16.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "tqdm>=4.68.3",
    "ty",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
namespace-packages = ["module"]
target-version = "py314"

[tool.ruff.lint]
# 全量启用稳定和预览规则，未采用的规则集中在 ignore 中排除。
preview = true
explicit-preview-rules = false
select = ["ALL"]
ignore = [
    "COM812",
    "CPY",
    "D",
    "DOC",
    "DTZ001",
    "DTZ005",
    "FURB140",
    "FURB189",
    "INP",
    "N818",
    "PLC1901",
    "PLR0904",
    "PLR2004",
    "PLR6201",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF031",
    "RUF069",
    "S311",
    "S404",
]
[tool.ruff.lint.per-file-ignores]
"campaign/war_archives_*/*.py" = ["TID252"]
"dev_tools/**/*.py" = ["T201"]
"module/device/platform/utils.py" = ["N801"]
"module/game_setting/setting_generated.py" = ["N815"]
"module/webui/setting.py" = ["N801"]
"tests/test_campaign_stage_name.py" = ["PLC2701"]
"tests/test_webui_utils.py" = ["PLC2701"]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["cached_class_property"]

[tool.ruff.lint.pylint]
max-bool-expr = 6
max-locals = 20
max-nested-blocks = 6
max-statements-in-try = 20

[tool.ty.environment]
python-version = "3.14"
