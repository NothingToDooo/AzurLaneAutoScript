[project]
name = "azur-lane-auto-script"
version = "0.1.0"
description = "Personal AzurLaneAutoScript fork"
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "opencv-python",
    "imageio",
    "adbutils",
    "psutil",
    "rich",
    "pyyaml",
    "cnocr",
    "pywebio",
    "starlette",
    "onnxruntime>=1.27.0",
    "uvicorn>=0.50.2",
    "websockets>=16.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "tqdm>=4.68.3",
    "ty",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# 全量启用稳定和预览规则，未采用的规则集中在 ignore 中排除。
preview = true
explicit-preview-rules = false
select = ["ALL"]
ignore = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "B903",
    "COM812",
    "CPY",
    "D",
    "DOC",
    "DTZ001",
    "DTZ005",
    "FBT002",
    "FURB113",
    "FURB118",
    "FURB140",
    "FURB142",
    "FURB156",
    "FURB180",
    "FURB189",
    "INP",
    "N801",
    "N802",
    "N815",
    "N816",
    "N818",
    "PLC1901",
    "PLC2701",
    "PLC2801",
    "PLR0904",
    "PLR0914",
    "PLR0916",
    "PLR1702",
    "PLR2004",
    "PLR6104",
    "PLR6201",
    "PLR6301",
    "PLW0717",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF031",
    "RUF069",
    "S311",
    "S404",
    "TID",
]
[tool.ruff.lint.per-file-ignores]
"dev_tools/**/*.py" = ["T201"]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["cached_class_property"]

[tool.ty.environment]
python-version = "3.14"
