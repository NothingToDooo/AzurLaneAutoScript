[project]
name = "azur-lane-auto-script"
version = "0.1.0"
description = "Personal AzurLaneAutoScript fork"
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "opencv-python",
    "imageio",
    "adbutils",
    "uiautomator2",
    "uiautomator2cache",
    "psutil",
    "rich",
    "tqdm",
    "jellyfish",
    "pyyaml",
    "inflection",
    "pydantic",
    "aiofiles",
    "onepush",
    "pypresence",
    "cnocr",
    "pywebio",
    "starlette",
    "zerorpc",
    "pyzmq",
    "cached-property>=2.0.1",
    "onnxruntime>=1.27.0",
    "uvicorn>=0.50.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "B009",
    "B010",
    "B005",
    "B020",
    "B032",
    "C405",
    "C409",
    "C411",
    "E713",
    "E712",
    "E721",
    "E722",
    "F821",
    "F541",
    "F841",
    "I",
    "PIE808",
    "PLW0120",
    "PLW0127",
    "PLW3301",
    "RUF006",
    "RUF010",
    "RUF017",
    "RUF019",
    "RUF021",
    "RUF046",
    "RUF100",
    "SIM201",
    "SIM211",
    "UP004",
    "UP008",
    "UP015",
    "UP025",
    "UP032",
    "UP034",
    "UP037",
    "UP039",
    "UP041",
    "W291",
    "W293",
    "W605",
]
ignore = [
    "E501",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = [
    "campaign/**",
    "dev_tools/**",
    "submodule/**",
]

[tool.ty.rules]
# 当前动态历史代码的初始基线；后续按模块逐步收紧。
call-non-callable = "ignore"
deprecated = "ignore"
empty-body = "ignore"
index-out-of-bounds = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
invalid-parameter-default = "ignore"
invalid-return-type = "ignore"
invalid-super-argument = "ignore"
invalid-type-form = "ignore"
missing-argument = "ignore"
no-matching-overload = "ignore"
not-iterable = "ignore"
not-subscriptable = "ignore"
possibly-missing-submodule = "ignore"
unbound-type-variable = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"
unsupported-operator = "ignore"
